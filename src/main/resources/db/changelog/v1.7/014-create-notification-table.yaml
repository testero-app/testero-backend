databaseChangeLog:
  - changeSet:
      id: v1.7-014
      author: testero
      comment: "Create notification table for in-app notifications."
      changes:
        - createTable:
            tableName: notification
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: event
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: TEXT
              - column:
                  name: read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: notification
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_notification_user_id

        - createIndex:
            tableName: notification
            indexName: idx_notification_user_read
            columns:
              - column:
                  name: user_id
              - column:
                  name: read

        - sql:
            sql: >
              CREATE TRIGGER trg_notification_updated_at
              BEFORE UPDATE ON notification
              FOR EACH ROW EXECUTE FUNCTION set_updated_at();
