databaseChangeLog:
  - changeSet:
      id: v1.7-009
      author: testero
      comment: >
        Create assessment_template_topic (M:N join between assessment
        templates and topics) and assessment_snapshot_topic (frozen copy
        at publish time).
      changes:
        # ── Template-level join ────────────────────────────────────
        - createTable:
            tableName: assessment_template_topic
            columns:
              - column:
                  name: assessment_template_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: topic_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: assessment_template_topic
            columnNames: assessment_template_id, topic_id
            constraintName: pk_assessment_template_topic

        - addForeignKeyConstraint:
            baseTableName: assessment_template_topic
            baseColumnNames: assessment_template_id
            referencedTableName: assessment_template
            referencedColumnNames: id
            constraintName: fk_att_assessment_template_id

        - addForeignKeyConstraint:
            baseTableName: assessment_template_topic
            baseColumnNames: topic_id
            referencedTableName: topic
            referencedColumnNames: id
            constraintName: fk_att_topic_id

        - sql:
            sql: >
              CREATE TRIGGER trg_assessment_template_topic_updated_at
              BEFORE UPDATE ON assessment_template_topic
              FOR EACH ROW EXECUTE FUNCTION set_updated_at();

        # ── Snapshot-level frozen copy ─────────────────────────────
        - createTable:
            tableName: assessment_snapshot_topic
            columns:
              - column:
                  name: assessment_snapshot_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: topic_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: assessment_snapshot_topic
            columnNames: assessment_snapshot_id, topic_id
            constraintName: pk_assessment_snapshot_topic

        - addForeignKeyConstraint:
            baseTableName: assessment_snapshot_topic
            baseColumnNames: assessment_snapshot_id
            referencedTableName: assessment_snapshot
            referencedColumnNames: id
            constraintName: fk_ast_snapshot_id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: assessment_snapshot_topic
            baseColumnNames: topic_id
            referencedTableName: topic
            referencedColumnNames: id
            constraintName: fk_ast_topic_id

        - sql:
            sql: >
              CREATE TRIGGER trg_assessment_snapshot_topic_updated_at
              BEFORE UPDATE ON assessment_snapshot_topic
              FOR EACH ROW EXECUTE FUNCTION set_updated_at();
