# ── Profile ───────────────────────────────────────────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Datasource ────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Snapshotting an assessment inserts one row per question, option and subject link — 170 rows
# for a 28-question training session. Without batching each one is a separate round trip, which
# is invisible against a local database and seconds against a managed one.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Liquibase ────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ── Server ───────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api

# ── JWT (app.jwt.*) ──────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.algorithm=HS256
app.jwt.expire-hours=8

# ── CORS (app.cors.*) ───────────────────────────────────────
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}

# ── OpenAPI ─────────────────────────────────────────────────
# Pinned: clients generate their types from this spec (testero-web#134), so the
# dialect must not change silently under a springdoc upgrade.
springdoc.api-docs.version=openapi_3_0

# ── Actuator ────────────────────────────────────────────────
management.endpoints.web.exposure.include=info,health
management.endpoint.health.show-details=never
management.info.build.enabled=true
management.info.git.enabled=true
management.info.env.enabled=false
